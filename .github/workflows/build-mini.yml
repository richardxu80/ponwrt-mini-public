name: Build Mini
run-name: Build mini AN7581 (MD only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/an7581-mini3.config'
      - 'files/**'
      - '.github/workflows/build-mini.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-mini3-dl-${{ hashFiles('configs/an7581-mini3.config') }}
          restore-keys: ponwrt-mini3-dl-

      - name: Feeds update/install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link files/ into buildroot
        run: |
          # OpenWrt 会自动把 $TOPDIR/files 打进 rootfs
          ls -R files/ | head -30

      - name: Configure
        run: |
          cp configs/an7581-mini3.config .config
          make defconfig
          echo "=== 内核符号断言（缺则立刻失败，不烧 1.5 小时）==="
          for s in CONFIG_AIR_EN8811H_PHY CONFIG_PHYLIB; do
            if grep -qE "^${s}=(m|y)" .config; then echo "OK   ${s}"; else echo "FATAL ${s} 未启用"; exit 1; fi
          done
          grep -E "^CONFIG_(I2C|MDIO_DEVICE|AIROHA_EN7572)" .config || true
          echo "=== 关键项终态 ==="
          for k in TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi \
                   TARGET_PREINIT_IP PACKAGE_luci-app-passwall PACKAGE_adguardhome \
                   PACKAGE_kmod-airoha-xpon PACKAGE_airoha-pond PACKAGE_luci-app-pon \
                   PACKAGE_kmod-phy-airoha-en8811h PACKAGE_kmod-mac80211 PACKAGE_kmod-usb-storage; do
            grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" .config || echo "  ${k}: (未出现)"
          done

      - name: Download sources
        run: make download -j$(nproc) || make download -j8

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log | tail -120

      - name: Assert manifest
        run: |
          M=$(ls bin/targets/airoha/an7581/*.manifest | head -1)
          echo "manifest: $M"; echo "包数: $(wc -l < "$M")"
          fail=0
          for p in kmod-phy-airoha-en8811h airoha-en8811h-firmware kmod-libphy kmod-airoha-xpon kmod-airoha-pon-frontend kmod-nft-tproxy kmod-tun adguardhome; do
            if grep -q "^$p " "$M"; then echo "OK   $p"; else echo "MISS $p"; fail=1; fi
          done
          exit $fail

      - name: Report
        run: |
          echo "=== 产物 ==="
          ls -lh bin/targets/airoha/an7581/ 2>/dev/null || true
          echo
          echo "=== rootfs 内容抽查 ==="
          find build_dir/target-*/root-airoha -path '*uci-defaults*' -o -path '*adguardhome*' 2>/dev/null | head
          echo
          echo "=== 安装的包数 ==="
          wc -l bin/targets/airoha/an7581/*.manifest 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-mini-an7581
          path: |
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
