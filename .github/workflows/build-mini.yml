name: Build Mini
run-name: Build mini AN7581 (${{ github.sha }})

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/an7581-mini.config'
      - '.github/workflows/build-mini.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-mini-dl-${{ hashFiles('configs/an7581-mini.config') }}
          restore-keys: ponwrt-mini-dl-

      - name: Feeds update/install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (mini)
        run: |
          cp configs/an7581-mini.config .config
          make defconfig
          echo "=== 关键项 ==="
          grep -E 'TARGET_DEVICE_airoha_an7581_DEVICE_.*=y|luci-app-passwall=|kmod-mac80211=|kmod-usb-storage=|PACKAGE_dnsmasq-full=|PACKAGE_firewall4=' .config | grep -v '^#' | head -20

      - name: Download sources
        run: make download -j$(nproc) || make download -j8

      - name: Build
        run: make -j$(nproc) V=s 2>&1 | tail -200

      - name: Report size
        run: |
          echo "=== 产物 ==="
          ls -lh bin/targets/airoha/an7581/ 2>/dev/null || true
          echo
          echo "=== squashfs 体积对比 ==="
          for f in bin/targets/airoha/an7581/*.bin; do
            [ -f "$f" ] && echo "$(du -h "$f" | cut -f1)  $(basename "$f")"
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-mini-an7581
          path: |
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/sha256sums
          if-no-files-found: error
          retention-days: 30
